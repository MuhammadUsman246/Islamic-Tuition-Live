<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Ensure React Refresh preamble hooks exist synchronously
        if (typeof window !== 'undefined') {
          window.$RefreshReg$ = window.$RefreshReg$ || function() {};
          window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
        }

        // Filter any console messages containing [vite] or HMR noise
        var isViteLog = function(args) {
          if (!args) return false;
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            if (!item) continue;
            var str = typeof item === 'string' ? item : (item.message || (typeof item.toString === 'function' ? item.toString() : ''));
            if (typeof str === 'string') {
              var lower = str.toLowerCase();
              if (
                lower.indexOf('[vite]') !== -1 ||
                lower.indexOf('vite-hmr') !== -1 ||
                lower.indexOf('[hmr]') !== -1 ||
                lower.indexOf('vite-plugin-pwa') !== -1 ||
                lower.indexOf('websocket closed without opened') !== -1 ||
                lower.indexOf('failed to connect to websocket') !== -1 ||
                (lower.indexOf('vite') !== -1 && lower.indexOf('connecting') !== -1)
              ) {
                return true;
              }
            }
          }
          return false;
        };

        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          var orig = console[method];
          if (typeof orig === 'function') {
            console[method] = function() {
              if (isViteLog(arguments)) return;
              orig.apply(console, arguments);
            };
          }
        });

        // Suppress unhandled rejections related to vite websocket
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason) {
            var msg = (e.reason.message || String(e.reason)).toLowerCase();
            if (msg.indexOf('websocket') !== -1 || msg.indexOf('vite') !== -1) {
              e.preventDefault();
              e.stopPropagation();
            }
          }
        });

        // Suppress global error events related to vite websocket
        window.addEventListener('error', function(e) {
          if (e && e.message) {
            var msg = String(e.message).toLowerCase();
            if (msg.indexOf('websocket') !== -1 || msg.indexOf('vite') !== -1) {
              e.preventDefault();
              e.stopPropagation();
            }
          }
        });
      })();
    </script>
